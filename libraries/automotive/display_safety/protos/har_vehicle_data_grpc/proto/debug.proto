syntax = "proto3";

package har.debug;

message MoveBuggyRequest {
    float x = 1;
    float y = 2;
}

// Contains the response code for a PublishRequest.
enum DebugResponseStatus {
    STATUS_UNKNOWN = 0;
    STATUS_OK = 1;
    STATUS_SDV_ERROR = 2;
    STATUS_NOT_DELIVERED = 3;
    STATUS_PROTOCOL_ERROR = 4;
}

message DebugResponse {
  DebugResponseStatus status = 1;
}

service DebugService {
  rpc MoveBuggy(MoveBuggyRequest) returns (DebugResponse);
}
